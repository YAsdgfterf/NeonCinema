<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Beenshub V2..??</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #vanta-bg {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }
    .content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      color: #39ff14;
      text-align: center;
      font-size: 2rem;
      font-family: sans-serif;
      text-shadow: 0 0 12px #000, 0 0 24px #000, 0 0 36px #000, 0 0 48px #39ff14, 0 0 64px #39ff14;
      border: 2px solid #000;
      padding: 0.5em 2em;
      border-radius: 12px;
      background: rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div id="vanta-bg"></div>
  <div class="content">
    Coming soon...
  </div>
  <script>
    VANTA.CLOUDS({
      el: "#vanta-bg",
      skyColor: 0x0a2e0a,
      cloudColor: 0x145214,
      cloudShadowColor: 0x0a1f0a,
      sunColor: 0x1aff00,
      sunGlareColor: 0x39ff14,
      sunlightColor: 0x39ff14,
      speed: 1.2
    })
  </script>
</body>
</html>
